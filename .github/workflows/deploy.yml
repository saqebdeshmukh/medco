
name: Medco - CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medco-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Prepare PHP application files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "index.php")) {
            throw "index.php not found. Check repository structure."
          }

          if (!(Test-Path "config/app.php")) {
            throw "config/app.php not found."
          }

          if (!(Test-Path "data")) {
            New-Item -ItemType Directory -Path "data" | Out-Null
          }

          if (Test-Path "deploy") {
            Remove-Item "deploy" -Recurse -Force
          }

          robocopy . deploy /E /XD .git .github deploy
          $copyExitCode = $LASTEXITCODE

          Write-Host "Robocopy exit code: $copyExitCode"

          if ($copyExitCode -ge 8) {
            throw "File preparation failed. Robocopy exit code: $copyExitCode"
          }

          if (!(Test-Path "deploy/index.php")) {
            throw "index.php is missing from the deployment folder."
          }

          Write-Host "Medco deployment files prepared successfully."

          # Robocopy exit codes 0–7 indicate success.
          $global:LASTEXITCODE = 0


      - name: Deploy to MonsterASP.NET via Web Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.MEDCO_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.MEDCO_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.MEDCO_SERVER_USERNAME }}
          server-password: ${{ secrets.MEDCO_SERVER_PASSWORD }}
          source-path: 'deploy'
          target-delete: false
